<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; media-src http://127.0.0.1:*; font-src http://127.0.0.1:*; img-src http://127.0.0.1:* data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsh-pet-desktop</title>
    <style>
      :root {
        --pet-size: 462px;
        --video-height: 260px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #stage {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: var(--pet-size);
        height: var(--video-height);
        transform: translateX(-50%);
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.18s ease;
        pointer-events: none;
        transform-origin: center;
      }
      video.front {
        opacity: 1;
      }
      #hit {
        position: absolute;
        pointer-events: auto;
        cursor: grab;
      }
      #hit.dragging {
        cursor: grabbing;
      }
      .bubble {
        position: absolute;
        left: 50%;
        bottom: calc(var(--video-height) - var(--pet-size) * 0.108);
        transform: translateX(-50%);
        z-index: 3;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
        white-space: nowrap;
        font-family: 'Microsoft YaHei', sans-serif;
      }
      .bubble.on {
        opacity: 1;
      }
      #balance {
        min-width: calc(var(--pet-size) * 0.26);
        max-width: calc(var(--pet-size) * 0.55);
        padding: calc(var(--pet-size) * 0.022) calc(var(--pet-size) * 0.03);
        border-radius: calc(var(--pet-size) * 0.035);
        background: rgba(255, 255, 255, 0.93);
        color: #2b2b2b;
        font-size: calc(var(--pet-size) * 0.0455);
        line-height: 1.6;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
      }
      #balance::after,
      #spend::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: calc(var(--pet-size) * -0.017);
        transform: translateX(-50%);
        border: calc(var(--pet-size) * 0.017) solid transparent;
        border-bottom: none;
      }
      #balance::after {
        border-top-color: rgba(255, 255, 255, 0.93);
      }
      #spend {
        padding: calc(var(--pet-size) * 0.024) calc(var(--pet-size) * 0.034);
        border-radius: calc(var(--pet-size) * 0.04);
        background: linear-gradient(135deg, rgba(42, 52, 74, 0.96), rgba(23, 27, 40, 0.96));
        color: #fff;
        font-size: calc(var(--pet-size) * 0.042);
        line-height: 1.6;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      }
      #spend::after {
        border-top-color: rgba(42, 52, 74, 0.96);
      }
      .sub {
        font-size: 0.78em;
        color: rgba(43, 43, 43, 0.62);
      }
      .balance-value {
        color: #1d6fe8;
        font-weight: 700;
      }
      .peak {
        color: #e53935;
        font-weight: 700;
      }
      .idle {
        color: #2e9e4f;
        font-weight: 700;
      }
      .error {
        color: #d94f3d;
        font-size: 0.78em;
      }
      .spend-label {
        font-size: 0.82em;
        color: rgba(255, 255, 255, 0.72);
      }
      .spend-value {
        color: #ffb74d;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }
      @media (prefers-reduced-motion: reduce) {
        video,
        .bubble {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="balance" class="bubble"></div>
      <div id="spend" class="bubble"></div>
      <div id="stage">
        <video id="video-a" class="front" muted autoplay playsinline></video>
        <video id="video-b" muted autoplay playsinline></video>
        <div id="hit" title="dsh-pet"></div>
      </div>
    </div>
    <script type="module" src="./lib/renderer.js"></script>
  </body>
</html>
